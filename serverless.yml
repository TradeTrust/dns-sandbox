service: dns-sandbox-fyntech
useDotenv: true
variablesResolutionMode: 20210326
provider:
  name: aws
  runtime: nodejs14.x
  stage: "${opt:stage, 'offline'}"
  region: "${opt:region, 'ap-southeast-1'}"
  memorySize: 256
  deploymentBucket:
    name: "${env:DEPLOYMENT_BUCKET}"
  environment:
    DOMAIN: ${self:custom.DOMAIN}
    HOSTED_ZONE_ID: ${self:custom.HOSTED_ZONE_ID}
    RECORD_EXPIRY_TIME: ${self:custom.RECORD_EXPIRY_TIME.${self:provider.stage}, self:custom.RECORD_EXPIRY_TIME.default}
  tracing:
    lambda: true
    apiGateway: true
  logs:
    restApi:
      accessLogging: true
      executionLogging: true
      format: '{"id":"$context.requestId","extendedId":"$context.extendedRequestId","path":"$context.path","method":"$context.httpMethod","time":"$context.requestTime","source":"$context.identity.sourceIp","resourcePath":"$context.resourcePath","error":{"message":"$context.error.message","type":"$context.error.responseType","validation":"$context.error.validationErrorString"},"waf":{"response":"$context.wafResponseCode","error":"$context.waf.error","status":"$context.waf.status"},"response":{"latency":"$context.responseLatency","length":"$context.responseLength","status":"$context.status"},"apikey":"$context.identity.apiKeyId","xray":"$context.xrayTraceId"}'
      level: INFO
      # ALWAYS PUT TO FALSE, NEVER LOG RESPONSE DATA BECAUSE IT CAN BE SENSITIVE MOP DATA
      fullExecutionData: false
      roleManagedExternally: true
      role: ${self:custom.API_GATEWAY_LOGGING_ROLE_ARN}
  iamRoleStatements:
    - Effect: Allow
      Action: ["route53:ChangeResourceRecordSets"]
      Resource:
        - "Fn::Join":
            [
              "",
              [
                "arn:aws:route53:::hostedzone/",
                "${self:custom.HOSTED_ZONE_ID}",
              ],
            ]
    - Effect: Allow
      Action: ["states:GetExecutionHistory"]
      Resource:
        - "Fn::Join": ["", ["arn:aws:states:*:*:execution:DomainStateMachine*"]]

functions:
  getExecutionDetails:
    description: "Get the execution details of a step machine. Details include domain name created and expiry time"
    handler: index.getExecutionDetails
    environment:
      STATE_MACHINE_ARN: { "Ref": "DomainStateMachine" }
    events:
      - http:
          path: /execution/{executionId}
          method: GET
          cors: true
  create:
    description: "Create a DNS-TXT record."
    handler: index.create
  clean:
    description: "Delete a DNS-TXT record."
    handler: index.clean

stepFunctions:
  stateMachines:
    records:
      id: DomainStateMachine
      events:
        - http:
            path: /
            method: POST
            cors: true
            response:
              headers:
                Content-Type: "'application/json'"
              template:
                application/json: |
                  {
                    "executionId": "$input.json('$.executionArn').split(':')[7].replace('"', "")"
                  }
      definition:
        Comment: "An example of the Amazon States Language using wait states"
        StartAt: CreateRecord
        States:
          CreateRecord:
            Type: Task
            Resource:
              Fn::GetAtt: [create, Arn]
            Next: Wait
          Wait:
            Type: Wait
            Seconds: ${self:custom.RECORD_EXPIRY_TIME.${self:provider.stage}, self:custom.RECORD_EXPIRY_TIME.default}
            Next: DeleteRecord
          DeleteRecord:
            Type: Task
            Resource:
              Fn::GetAtt: [clean, Arn]
            End: true
custom:
  # https://github.com/serverless/serverless/issues/5534
  # change to seven days later 604800
  RECORD_EXPIRY_TIME:
    offline: 10
    stg: 3600
    prod: 86400
    fyntech-stg: 3600
    fyntech-prod: 2592000
    default: 3600
  DOMAIN: ${env:DOMAIN}
  HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID}
  API_GATEWAY_LOGGING_ROLE_ARN: ${env:API_GATEWAY_LOGGING_ROLE_ARN}
  webpack:
    excludeFiles: "*.test.ts"
  stepFunctionsOffline:
    CreateRecord: create
    Wait:
      Type: Wait
      Seconds: ${self:custom.RECORD_EXPIRY_TIME.${self:provider.stage}, self:custom.RECORD_EXPIRY_TIME.default}
    DeleteRecord: clean
  serverless-offline:
    noPrependStageInUrl: true
  associateWaf:
    name: ${env:WAF_NAME}
    version: V2

plugins:
  - serverless-step-functions
  - serverless-webpack
  - serverless-dotenv-plugin
  - serverless-step-functions-offline
  - serverless-offline
  - serverless-associate-waf
