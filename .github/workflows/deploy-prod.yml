name: PROD deploy
concurrency: 
  group: prod-deploy
  cancel-in-progress: true

on:
  workflow_dispatch:
env:
  AWS_REGION: ap-southeast-1
  DOMAIN: sandbox.fyntech.io
  DID_DOMAIN: playground.fyntech.io
  HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
  DEPLOYMENT_BUCKET: tradetrust-prod-serverless-deployment-49690046e4	
  WAF_NAME: tradetrust-prod
  DOMAIN_ENABLED: true
  AUTO_DOMAIN: true
  API_GATEWAY_LOGGING_ROLE_ARN: ${{ secrets.API_GATEWAY_LOGGING_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  
jobs:
  deploy-prod:
    name: deploy prod
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: checkout original source code
        uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: serverless deploy
        run: npx sls deploy --conceal --stage prod
        env:
          SLS_DEBUG: "*"
          AWSJS_DEBUG: "*"